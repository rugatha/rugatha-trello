<!DOCTYPE html>
<html lang="zh-Hant">
<head><base href="../../"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>板塊 Boardly · 專案工作空間</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar"><div class="logo"><span class="logo-icon">▥</span>板塊 <span style="font-weight:400;color:#606d65;font-size:12px;margin-left:6px">Boardly</span></div><div class="row"><input id="search" class="global-search" placeholder="⌕  搜尋此看板的卡片…" aria-label="搜尋卡片"><button class="primary" id="quickCreate">＋ 建立卡片</button><button id="googleSignIn" class="google-sign-in" type="button"><span class="google-mark" aria-hidden="true">G</span>使用 Google 登入</button><button id="currentUser" class="row" aria-label="目前使用者"></button></div></header>
<div class="layout"><aside><div class="row"><div class="workspace-icon">R</div><div class="workspace-text"><strong>我的工作空間</strong><div class="muted small" style="margin-top:5px">把想法，變成進展。</div></div></div><div><div class="section-label">WORKSPACE</div><button class="nav-button active" id="workspaceNav"><span>▦</span><span class="nav-text">專案看板</span></button><button class="nav-button" id="membersBtn"><span>♧</span><span class="nav-text">工作空間成員</span></button></div><button id="manageMembers" class="nav-button" type="button" hidden>會員管理</button><div class="sidebar-boards"><div class="row between sidebar-boards-heading" style="padding-right:5px"><span class="section-label">我的看板</span><button id="addBoard" aria-label="新增看板">＋</button></div><nav id="boardNav" aria-label="我的看板"></nav></div></aside><main class="main"><section class="board-header"><div class="breadcrumb">工作空間 <span style="margin:0 9px">/</span> 我的看板 <span style="margin:0 9px">/</span><span id="crumb"></span></div><div class="row between"><div class="grow"><h1 class="heading" id="boardTitle"></h1><p class="board-description" id="boardDescription"></p></div><div class="board-title-actions"><button id="starBoard" aria-label="收藏看板">☆</button><button id="editBoard" aria-label="編輯看板">⋯</button></div></div><div class="viewbar"><div class="tab">▥ &nbsp; 看板</div><div class="row"><div id="headerMembers" class="row header-members" style="gap:0"></div><button class="pill" id="inviteBtn">會員資訊</button></div></div></section><div class="board-controls"><div class="row"><button id="mineFilter" class="pill">♙ &nbsp; 指派給我</button><select id="dueFilter" class="pill" aria-label="截止日期篩選"><option value="all">◷ 所有截止日期</option><option value="overdue">已逾期</option><option value="week">未來 7 天</option><option value="none">未設定日期</option></select><button id="clearFilters" class="small muted hidden">清除篩選</button></div><span id="boardStats" class="stat-note"></span></div><div class="row" style="padding:8px 24px"><span id="syncStatus" role="status" class="grow"></span><button id="archiveBtn" type="button">封存項目</button><button id="refreshWorkspace">重新整理</button></div><div id="columns" class="columns"></div></main></div>
<dialog id="userDialog" class="modal"><div class="modal-head"><h2 id="userDialogTitle">Google 登入</h2><button id="closeUser" aria-label="關閉">✕</button></div><div class="modal-body"><div id="googleAccountPanel" hidden><p id="googleAccountSummary"></p><p id="workspaceAccess" class="help-note"></p><p class="help-note">看板與牌卡直接讀寫 Firebase。</p><div class="row"><button id="editGoogleName" class="primary" type="button">修改顯示名稱</button><button id="googleSignOut" type="button">登出 Google</button></div></div><div id="localUserPanel"><p class="help-note" style="margin-top:0">使用 Google 登入後可設定自己的顯示名稱。會員資料由 Firestore 管理。</p><button id="dialogGoogleSignIn" class="google-sign-in" type="button"><span class="google-mark" aria-hidden="true">G</span>使用 Google 登入</button></div></div></dialog>
<dialog id="nameDialog" class="modal name-dialog"><form id="googleNameForm"><div class="modal-head"><h2>設定顯示名稱</h2></div><div class="modal-body"><p class="help-note">請設定工作空間的顯示名稱。同一會員使用不同 Google 信箱登入時，會共用這個名稱。</p><label for="googleDisplayName">顯示名稱</label><input id="googleDisplayName" class="full" maxlength="40" required autocomplete="nickname" placeholder="例如：小明"><p id="googleNameError" class="danger" role="alert"></p><div class="row" style="justify-content:flex-end"><button id="cancelGoogleName" type="button">取消</button><button class="primary" type="submit">儲存名稱</button></div></div></form></dialog>
<dialog id="editor" class="modal"></dialog><dialog id="simpleDialog" class="modal" style="width:460px"></dialog><dialog id="archiveDialog" class="modal" aria-labelledby="archiveTitle"><div class="modal-head"><h2 id="archiveTitle">封存項目</h2><button id="closeArchive" type="button" aria-label="關閉封存項目">✕</button></div><div class="modal-body"><p id="archiveBoardName" class="help-note"></p><h3>牌卡</h3><div id="archivedCards"></div><h3>附件</h3><div id="archivedAttachments"></div><p id="archiveStatus" role="status"></p></div></dialog><div id="toast" class="toast hidden" role="status"></div>
<dialog id="membershipDialog" class="modal" aria-label="會員管理"></dialog>
<script src="./membership-ui.js" type="module"></script>
<script src="./app.js?v=20261008-management" type="module"></script>
<section style="position:fixed;inset:10px;z-index:10000;background:white;padding:20px;overflow:auto" id="liveProbe">
<h1>階段四正式附件驗證</h1><p>讀取使用目前登入帳號；Owner 測試會建立一張測試牌卡並於完成後封存。</p>
<button id="probeRead">驗證授權圖片讀取</button><button id="probeDownload">下載授權附件</button><button id="probeDeniedUpload">驗證 Viewer 上傳拒絕</button><button id="probeOwner">執行 Owner 上傳與封存測試</button>
<button id="probeRevoked">驗證撤權後原附件遭拒</button><button id="probeAccount">登入帳號管理</button>
<img id="probeImage" alt="授權圖片" style="max-width:300px;max-height:200px"><pre id="probeResults" style="white-space:pre-wrap"></pre></section>
<script type="module" src="tests/browser/live-attachments.js"></script></body>
</html>
