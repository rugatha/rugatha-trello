<!DOCTYPE html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>板塊 Boardly · 專案工作空間</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar"><div class="logo"><span class="logo-icon">▥</span>板塊 <span style="font-weight:400;color:#606d65;font-size:12px;margin-left:6px">Boardly</span></div><div class="row"><input id="search" class="global-search" placeholder="⌕  搜尋此看板的卡片…" aria-label="搜尋卡片"><button class="primary" id="quickCreate">＋ 建立卡片</button><button id="googleSignIn" class="google-sign-in" type="button"><span class="google-mark" aria-hidden="true">G</span>使用 Google 登入</button><button id="currentUser" class="row" aria-label="目前使用者"></button></div></header>
<div class="layout"><aside><div class="row"><div class="workspace-icon">R</div><div class="workspace-text"><strong>我的工作空間</strong><div class="muted small" style="margin-top:5px">把想法，變成進展。</div></div></div><div><div class="section-label">WORKSPACE</div><button class="nav-button active" id="workspaceNav"><span>▦</span><span class="nav-text">專案看板</span></button><button class="nav-button" id="cloudBoardsBtn" hidden><span>☁</span><span class="nav-text">雲端看板</span></button><button class="nav-button" id="membersBtn"><span>♧</span><span class="nav-text">工作空間成員</span></button></div><div class="sidebar-boards"><div class="row between sidebar-boards-heading" style="padding-right:5px"><span class="section-label">我的看板</span><button id="addBoard" aria-label="新增看板">＋</button></div><nav id="boardNav" aria-label="我的看板"></nav></div></aside><main class="main"><section class="board-header"><div class="breadcrumb">工作空間 <span style="margin:0 9px">/</span> 我的看板 <span style="margin:0 9px">/</span><span id="crumb"></span></div><div class="row between"><div class="grow"><h1 class="heading" id="boardTitle"></h1><p class="board-description" id="boardDescription"></p></div><div class="board-title-actions"><button id="starBoard" aria-label="收藏看板">☆</button><button id="editBoard" aria-label="編輯看板">⋯</button></div></div><div class="viewbar"><div class="tab">▥ &nbsp; 看板</div><div class="row"><div id="headerMembers" class="row header-members" style="gap:0"></div><button class="pill" id="inviteBtn">會員資訊</button></div></div></section><div class="board-controls"><div class="row"><button id="mineFilter" class="pill">♙ &nbsp; 指派給我</button><select id="dueFilter" class="pill" aria-label="截止日期篩選"><option value="all">◷ 所有截止日期</option><option value="overdue">已逾期</option><option value="week">未來 7 天</option><option value="none">未設定日期</option></select><button id="clearFilters" class="small muted hidden">清除篩選</button></div><span id="boardStats" class="stat-note"></span></div><div id="columns" class="columns"></div></main></div>
<dialog id="userDialog" class="modal"><div class="modal-head"><h2 id="userDialogTitle">Google 登入</h2><button id="closeUser" aria-label="關閉">✕</button></div><div class="modal-body"><div id="googleAccountPanel" hidden><p id="googleAccountSummary"></p><p id="workspaceAccess" class="help-note"></p><p class="help-note">牌卡編輯目前仍儲存在這台裝置；雲端看板另行開啟。</p><div class="row"><button id="editGoogleName" class="primary" type="button">修改顯示名稱</button><button id="googleSignOut" type="button">登出 Google</button></div></div><div id="localUserPanel"><p class="help-note" style="margin-top:0">使用 Google 登入後可設定自己的顯示名稱。會員資料由 Firestore 管理。</p><button id="dialogGoogleSignIn" class="google-sign-in" type="button"><span class="google-mark" aria-hidden="true">G</span>使用 Google 登入</button></div></div></dialog>
<dialog id="nameDialog" class="modal name-dialog"><form id="googleNameForm"><div class="modal-head"><h2>設定顯示名稱</h2></div><div class="modal-body"><p class="help-note">你已使用 Google 帳號登入。請決定在板塊顯示的名稱，不會自動認領同名的舊成員紀錄。</p><label for="googleDisplayName">顯示名稱</label><input id="googleDisplayName" class="full" maxlength="40" required autocomplete="nickname" placeholder="例如：小明"><p id="googleNameError" class="danger" role="alert"></p><div class="row" style="justify-content:flex-end"><button id="cancelGoogleName" type="button">取消</button><button class="primary" type="submit">儲存名稱</button></div></div></form></dialog>
<dialog id="cloudDialog" class="modal cloud-dialog"><div class="modal-head"><h2>雲端看板</h2><button id="closeCloud" type="button" aria-label="關閉雲端看板">✕</button></div><div class="modal-body"><p class="help-note">這裡直接讀寫 Firestore，與本機看板分開。</p><p id="cloudStatus" role="status"></p><div class="row cloud-toolbar"><label for="cloudBoardSelect">看板</label><select id="cloudBoardSelect" class="grow"></select><button id="refreshCloud" type="button">重新整理</button></div><div id="cloudBoardArea" hidden><form id="cloudNewCardForm" class="row cloud-toolbar"><select id="cloudNewCardColumn" aria-label="新牌卡階段" required></select><input id="cloudNewCardTitle" class="grow" maxlength="150" required placeholder="新增雲端牌卡標題"><button class="primary" type="submit">新增</button></form><div id="cloudCards" class="cloud-cards"></div><button id="cloudLoadMore" type="button" hidden>載入更多牌卡</button></div><section id="cloudCardDetail" class="cloud-card-detail" hidden><h3>牌卡內容</h3><label for="cloudCardTitle">標題</label><input id="cloudCardTitle" class="full" maxlength="150" required><label for="cloudCardDescription">說明</label><textarea id="cloudCardDescription" class="full"></textarea><label for="cloudCardStage">所在階段</label><select id="cloudCardStage" class="full"></select><button id="saveCloudCard" class="primary" type="button">儲存牌卡</button><h3>待辦事項</h3><div id="cloudChecklist"></div><form id="cloudCheckForm" class="row"><input id="cloudCheckText" class="grow" maxlength="200" required placeholder="新增待辦事項"><button class="primary" type="submit">新增</button></form><h3>留言</h3><div id="cloudComments"></div><form id="cloudCommentForm" class="row"><input id="cloudCommentText" class="grow" maxlength="5000" required placeholder="輸入留言"><button class="primary" type="submit">送出</button></form></section></div></dialog>
<dialog id="editor" class="modal"></dialog><dialog id="simpleDialog" class="modal" style="width:460px"></dialog><input type="file" id="importInput" accept="application/json,.json" hidden><div id="toast" class="toast hidden" role="status"></div>
<script src="./storage.js" defer></script>
<script src="./app.js" defer></script>
<script src="./auth.js" type="module"></script>
<script src="./cloud.js" type="module"></script>
</body>
</html>
