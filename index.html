<!DOCTYPE html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>板塊 Boardly · 專案工作空間</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar"><div class="logo"><span class="logo-icon">▥</span>板塊 <span style="font-weight:400;color:#606d65;font-size:12px;margin-left:6px">Boardly</span></div><div class="row"><input id="search" class="global-search" placeholder="⌕  搜尋此看板的卡片…" aria-label="搜尋卡片"><button class="primary" id="quickCreate">＋ 建立卡片</button><button id="currentUser" class="row" aria-label="切換使用者"></button></div></header>
<div class="layout"><aside><div class="row"><div class="workspace-icon">R</div><div class="workspace-text"><strong>我的工作空間</strong><div class="muted small" style="margin-top:5px">把想法，變成進展。</div></div></div><div><div class="section-label">WORKSPACE</div><button class="nav-button active" id="workspaceNav"><span>▦</span><span class="nav-text">專案看板</span></button><button class="nav-button" id="membersBtn"><span>♧</span><span class="nav-text">工作空間成員</span></button></div><div class="sidebar-boards"><div class="row between sidebar-boards-heading" style="padding-right:5px"><span class="section-label">我的看板</span><button id="addBoard" aria-label="新增看板">＋</button></div><nav id="boardNav" aria-label="我的看板"></nav></div></aside><main class="main"><section class="board-header"><div class="breadcrumb">工作空間 <span style="margin:0 9px">/</span> 我的看板 <span style="margin:0 9px">/</span><span id="crumb"></span></div><div class="row between"><div class="grow"><h1 class="heading" id="boardTitle"></h1><p class="board-description" id="boardDescription"></p></div><div class="board-title-actions"><button id="starBoard" aria-label="收藏看板">☆</button><button id="editBoard" aria-label="編輯看板">⋯</button></div></div><div class="viewbar"><div class="tab">▥ &nbsp; 看板</div><div class="row"><div id="headerMembers" class="row header-members" style="gap:0"></div><button class="pill" id="inviteBtn">＋ 新增成員</button></div></div></section><div class="board-controls"><div class="row"><button id="mineFilter" class="pill">♙ &nbsp; 指派給我</button><select id="dueFilter" class="pill" aria-label="截止日期篩選"><option value="all">◷ 所有截止日期</option><option value="overdue">已逾期</option><option value="week">未來 7 天</option><option value="none">未設定日期</option></select><button id="clearFilters" class="small muted hidden">清除篩選</button></div><span id="boardStats" class="stat-note"></span></div><div id="columns" class="columns"></div></main></div>
<dialog id="userDialog" class="modal"><div class="modal-head"><h2>選擇你的工作身分</h2><button id="closeUser" aria-label="關閉">✕</button></div><div class="modal-body"><p class="help-note" style="margin-top:0">歡迎回來！選擇成員或建立自己的 username。<br>這些是本機身分，並非登入驗證或線上帳號。</p><div id="userList"></div><form id="newUserForm" class="row" style="margin-top:20px"><input id="newUsername" class="grow" placeholder="輸入新的 username" maxlength="40" required aria-label="新使用者名稱"><button class="primary">加入</button></form></div></dialog>
<dialog id="editor" class="modal"></dialog><dialog id="simpleDialog" class="modal" style="width:460px"></dialog><input type="file" id="importInput" accept="application/json,.json" hidden><div id="toast" class="toast hidden" role="status"></div>
<script src="./storage.js" defer></script>
<script src="./app.js" defer></script>
</body>
</html>
