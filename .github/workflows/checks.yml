name: Regression and dependency review
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 1'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm test
      - run: npm run test:rules
      - run: npm run test:storage-rules
      - run: npm run test:management
      - run: npm run test:attachments
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix functions --ignore-scripts
      - name: Collect audit reports
        run: |
          npm audit --json > audit-tools.json || true
          npm audit --prefix functions --json > audit-functions.json || true
      - uses: actions/upload-artifact@v7
        with:
          name: dependency-audit
          path: audit-*.json
          retention-days: 14
